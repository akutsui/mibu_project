<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開業準備 進捗管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --ink:#20302c; --sub:#5b6b66; --line:#dcd6c8;
  --accent:#a8672f; --accent-soft:#f1e2ce; --card:#ffffff; --done:#5c7a63; --done-bg:#e7efe6;
  --warn:#b5762b; --warn-bg:#f6e6ce;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161c1a; --ink:#eee9df; --sub:#9aa39c; --line:#33403a;
    --accent:#e0a367; --accent-soft:#2c2419; --card:#1f2723; --done:#8fb59a; --done-bg:#1d2b21;
    --warn:#e0a367; --warn-bg:#2c2419;
  }
}
:root[data-theme="dark"]{
  --bg:#161c1a; --ink:#eee9df; --sub:#9aa39c; --line:#33403a;
  --accent:#e0a367; --accent-soft:#2c2419; --card:#1f2723; --done:#8fb59a; --done-bg:#1d2b21;
  --warn:#e0a367; --warn-bg:#2c2419;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:820px; margin:0 auto; padding:32px 20px 80px;}
header{margin-bottom:28px;}
h1{font-size:1.5rem; font-weight:900; margin:0 0 4px; letter-spacing:.02em;}
.lead{color:var(--sub); font-size:.88rem; margin:0;}

.progress-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:20px; margin:20px 0 14px; display:flex; align-items:center; gap:18px;
}
.ring{flex-shrink:0;}
.progress-text{flex:1;}
.progress-num{font-size:1.9rem; font-weight:900; line-height:1;}
.progress-sub{color:var(--sub); font-size:.82rem; margin-top:4px;}
.bar-track{background:var(--line); height:6px; border-radius:99px; margin-top:10px; overflow:hidden;}
.bar-fill{background:var(--accent); height:100%; border-radius:99px; transition:width .3s ease;}

.milestone{
  border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--card);
  border-radius:10px; padding:14px 16px; margin-bottom:14px; font-size:.86rem; color:var(--sub);
}
.milestone b{color:var(--ink);}
.sync{
  display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--sub);
  margin-bottom:24px; padding:2px 2px;
}
.dot{width:7px; height:7px; border-radius:50%; background:var(--sub); flex-shrink:0;}
.dot.live{background:var(--done);}
.dot.local{background:var(--accent);}

.cat{margin-bottom:18px; border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden;}
.cat-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 16px; cursor:pointer; user-select:none;
}
.cat-title{font-weight:700; font-size:.98rem;}
.cat-meta{display:flex; align-items:center; gap:10px; color:var(--sub); font-size:.78rem; white-space:nowrap;}
.cat-count{font-variant-numeric:tabular-nums;}
.chev{transition:transform .2s ease; color:var(--sub); font-size:.8rem;}
.cat.open .chev{transform:rotate(90deg);}
.items{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.cat.open .items{max-height:4000px;}
.item{padding:12px 16px; border-top:1px solid var(--line);}
.item-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.item-text{font-size:.9rem; line-height:1.45;}
.item.complete .item-text{color:var(--sub); text-decoration:line-through;}

.f-status{
  font-family:inherit; font-size:.76rem; font-weight:500; padding:4px 9px; border-radius:99px;
  border:1px solid var(--line); background:var(--bg); color:var(--sub); cursor:pointer; flex-shrink:0;
}
.f-status.st-ordered{background:var(--warn-bg); color:var(--warn); border-color:var(--warn);}
.f-status.st-done{background:var(--done-bg); color:var(--done); border-color:var(--done);}

.fields{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.field{display:flex; flex-direction:column; gap:2px;}
.field-label{font-size:.66rem; color:var(--sub);}
.fields input, .fields select{
  font-family:inherit; font-size:.78rem; padding:5px 8px; border-radius:7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink); min-width:0;
}
.f-assignee{width:98px;}
.f-due{width:140px;}
.f-vendor{width:130px;}
.f-approval{width:110px; cursor:pointer; align-self:flex-end;}
.f-approval.ap-pending{background:var(--warn-bg); color:var(--warn); border-color:var(--warn);}
.f-approval.ap-approved{background:var(--done-bg); color:var(--done); border-color:var(--done);}

footer{text-align:center; color:var(--sub); font-size:.76rem; margin-top:30px;}
button.reset{
  background:none; border:1px solid var(--line); color:var(--sub); border-radius:8px;
  padding:6px 12px; font-size:.76rem; cursor:pointer; font-family:inherit;
}
button.reset:hover{border-color:var(--accent); color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>新規開業準備 進捗管理</h1>
    <p class="lead">ステータス・担当者・納期・発注先・承認状況をあわせて管理できます。変更はスプレッドシートと共有されます。</p>
  </header>

  <div class="progress-card">
    <svg class="ring" width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="30" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle id="ringFill" cx="36" cy="36" r="30" fill="none" stroke="var(--accent)" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"
        transform="rotate(-90 36 36)"/>
    </svg>
    <div class="progress-text">
      <div class="progress-num" id="pctNum">0%</div>
      <div class="progress-sub" id="pctSub">完了 0 / 0</div>
      <div class="progress-sub" id="apprSub">承認済み 0 / 0</div>
      <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="milestone">
    内装工事は<b>着工済み</b>。完了・引き渡し予定日は<b>11月16日</b>。総務的備品は11〜12月に準備予定。
  </div>
  <div class="sync" id="syncStatus"><span class="dot"></span><span>接続を確認中…</span></div>

  <div id="categories"></div>

  <footer>
    <button class="reset" id="resetBtn">ステータスをすべて「未対応」に戻す</button>
  </footer>
</div>

<script>
const DATA = [
  { id: "somu", title: "総務的備品", items: [
      { t: "通信設備系（PBX関連・複合機）" },
      { t: "職員用冷蔵庫" },
      { t: "掃除機" },
      { t: "什器類（キャビネット・スチールラック）" },
      { t: "シュレッダー" },
      { t: "駐車場の確保" },
      { t: "車両の手配" },
      { t: "ウォーターサーバー" },
      { t: "アルコールチェッカー" },
      { t: "各種アカウントの設定" },
  ]},
  { id: "jimu", title: "事務的備品", items: [
      { t: "事務的備品一式の手配" },
  ]},
  { id: "iryoki", title: "医療機器等の購入", items: [
      { t: "電子カルテ" },
      { t: "ポータブルエコー（V-SCAN候補）" },
      { t: "ポータブル心電図" },
      { t: "医療用冷蔵庫" },
      { t: "滅菌機" },
      { t: "麻薬金庫" },
      { t: "医療用廃棄物の処理手配" },
  ]},
  { id: "zairyo", title: "医療材料等", items: [
      { t: "卸への発注手配" },
  ]},
  { id: "bag", title: "診療バッグ等", items: [
      { t: "診療バッグ等の準備" },
  ]},
  { id: "gaichu", title: "外注契約", items: [
      { t: "検体検査の外注契約" },
      { t: "医療ごみ処理の外注契約" },
      { t: "産業ごみ（一般ごみ）処理の外注契約" },
  ]},
];

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx-jPnyjqfcHuIPj8u-LsMG1urnmQmbN4WpPjtuny61--EpIgHJv_4BPKYrwsYEOWUUjw/exec";
const POLL_MS = 6000;
const EMPTY_ITEM = { status:"未対応", assignee:"", due:"", vendor:"", approval:"" };
const STATUS_OPTIONS = ["未対応", "発注済", "完了"];

const STORAGE_KEY = "clinic-prep-progress-v3";
let state = {};
let mode = "local";
let pollTimer = null;
let pending = false;
const openState = {};

try {
  const raw = localStorage.getItem(STORAGE_KEY);
  state = raw ? JSON.parse(raw) : {};
} catch(e) { state = {}; }

function itemOf(key){ return state[key] || {...EMPTY_ITEM}; }

function setSyncBanner(kind, text) {
  document.getElementById("syncStatus").innerHTML =
    `<span class="dot ${kind === "shared" ? "live" : "local"}"></span><span>${text}</span>`;
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

async function fetchState() {
  const res = await fetch(WEBAPP_URL + "?action=get");
  if (!res.ok) throw new Error("fetch failed");
  const data = await res.json();
  return data.items || {};
}
async function pushField(key, field, value) {
  const url = WEBAPP_URL + "?action=update&key=" + encodeURIComponent(key) +
    "&field=" + field + "&value=" + encodeURIComponent(value);
  const res = await fetch(url);
  if (!res.ok) throw new Error("update failed");
  const data = await res.json();
  return data.items || {};
}
async function poll() {
  if (pending) return;
  try {
    state = await fetchState();
    setSyncBanner("shared", "スプレッドシートと共有中（数秒ごとに自動更新）");
    render();
  } catch (e) {
    setSyncBanner("local", "共有先に接続できません（この端末にのみ保存されます）");
  }
}
function updateField(key, field, value) {
  state[key] = { ...itemOf(key), [field]: value };
  if (mode === "shared") {
    pending = true;
    pushField(key, field, value)
      .then(items => { state = items; })
      .catch(() => { setSyncBanner("local", "更新の送信に失敗しました。接続を確認してください"); })
      .finally(() => { pending = false; render(); });
  } else {
    saveLocal();
    render();
  }
}
async function initSync() {
  if (!WEBAPP_URL || WEBAPP_URL.indexOf("PASTE_YOUR") === 0) {
    setSyncBanner("local", "この端末にのみ保存されます（WEBAPP_URL未設定）");
    return;
  }
  try {
    state = await fetchState();
    mode = "shared";
    setSyncBanner("shared", "スプレッドシートと共有中（数秒ごとに自動更新）");
    render();
    pollTimer = setInterval(poll, POLL_MS);
  } catch (e) {
    setSyncBanner("local", "共有先に接続できません（この端末にのみ保存されます）");
  }
}

function statusClass(s) {
  if (s === "発注済") return "st-ordered";
  if (s === "完了") return "st-done";
  return "";
}

function render() {
  const root = document.getElementById("categories");
  root.innerHTML = "";
  let total = 0, doneCount = 0, apprTotal = 0, apprDone = 0;

  DATA.forEach(cat => {
    const catDone = cat.items.filter(it => itemOf(cat.id + ":" + it.t).status === "完了").length;
    total += cat.items.length; doneCount += catDone;

    const el = document.createElement("div");
    el.className = "cat" + (openState[cat.id] ? " open" : "");

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `
      <span class="cat-title">${cat.title}</span>
      <span class="cat-meta"><span class="cat-count">${catDone}/${cat.items.length}</span><span class="chev">›</span></span>
    `;
    head.addEventListener("click", () => { openState[cat.id] = !openState[cat.id]; render(); });
    el.appendChild(head);

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "items";
    cat.items.forEach(it => {
      const key = cat.id + ":" + it.t;
      const rec = itemOf(key);
      apprTotal++;
      if (rec.approval === "承認済み") apprDone++;

      const row = document.createElement("div");
      row.className = "item" + (rec.status === "完了" ? " complete" : "");

      const top = document.createElement("div");
      top.className = "item-top";
      top.innerHTML = `
        <span class="item-text">${it.t}</span>
        <select class="f-status ${statusClass(rec.status)}">
          ${STATUS_OPTIONS.map(s => `<option value="${s}" ${rec.status === s ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      `;
      top.querySelector(".f-status").addEventListener("change", (e) => updateField(key, "status", e.target.value));
      row.appendChild(top);

      const fields = document.createElement("div");
      fields.className = "fields";
      fields.innerHTML = `
        <div class="field"><span class="field-label">担当者</span><input class="f-assignee" placeholder="氏名" value="${rec.assignee || ""}"></div>
        <div class="field"><span class="field-label">納期</span><input class="f-due" type="date" value="${rec.due || ""}"></div>
        <div class="field"><span class="field-label">発注先</span><input class="f-vendor" placeholder="会社名" value="${rec.vendor || ""}"></div>
        <select class="f-approval ${rec.approval === "申請中" ? "ap-pending" : rec.approval === "承認済み" ? "ap-approved" : ""}">
          <option value="" ${rec.approval === "" ? "selected" : ""}>承認: 未定</option>
          <option value="申請中" ${rec.approval === "申請中" ? "selected" : ""}>承認: 申請中</option>
          <option value="承認済み" ${rec.approval === "承認済み" ? "selected" : ""}>承認: 承認済み</option>
        </select>
      `;
      fields.querySelector(".f-assignee").addEventListener("change", (e) => updateField(key, "assignee", e.target.value));
      fields.querySelector(".f-due").addEventListener("change", (e) => updateField(key, "due", e.target.value));
      fields.querySelector(".f-vendor").addEventListener("change", (e) => updateField(key, "vendor", e.target.value));
      fields.querySelector(".f-approval").addEventListener("change", (e) => updateField(key, "approval", e.target.value));
      row.appendChild(fields);

      itemsWrap.appendChild(row);
    });
    el.appendChild(itemsWrap);
    root.appendChild(el);
  });

  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  document.getElementById("pctNum").textContent = pct + "%";
  document.getElementById("pctSub").textContent = `完了 ${doneCount} / ${total}`;
  document.getElementById("apprSub").textContent = `承認済み ${apprDone} / ${apprTotal}`;
  document.getElementById("barFill").style.width = pct + "%";
  const circumference = 188.5;
  document.getElementById("ringFill").style.strokeDashoffset = circumference - (circumference * pct / 100);
}

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("すべてのステータスを「未対応」に戻しますか？（担当者・納期・発注先・承認状況は残ります）")) return;
  const keys = Object.keys(state);
  for (const k of keys) { state[k] = { ...itemOf(k), status: "未対応" }; }
  if (mode === "shared") {
    for (const k of keys) { try { await pushField(k, "status", "未対応"); } catch(e) {} }
  } else {
    saveLocal();
  }
  render();
});

render();
initSync();
</script>
</body>
</html>
