<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開業準備 進捗管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --ink:#20302c; --sub:#5b6b66; --line:#dcd6c8;
  --accent:#a8672f; --accent-soft:#f1e2ce; --card:#ffffff; --done:#5c7a63; --done-bg:#e7efe6;
  --warn:#b5762b; --warn-bg:#f6e6ce;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161c1a; --ink:#eee9df; --sub:#9aa39c; --line:#33403a;
    --accent:#e0a367; --accent-soft:#2c2419; --card:#1f2723; --done:#8fb59a; --done-bg:#1d2b21;
    --warn:#e0a367; --warn-bg:#2c2419;
  }
}
:root[data-theme="dark"]{
  --bg:#161c1a; --ink:#eee9df; --sub:#9aa39c; --line:#33403a;
  --accent:#e0a367; --accent-soft:#2c2419; --card:#1f2723; --done:#8fb59a; --done-bg:#1d2b21;
  --warn:#e0a367; --warn-bg:#2c2419;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:820px; margin:0 auto; padding:32px 20px 80px;}
header{margin-bottom:28px;}
h1{font-size:1.5rem; font-weight:900; margin:0 0 4px; letter-spacing:.02em;}
.lead{color:var(--sub); font-size:.88rem; margin:0;}

.progress-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:20px; margin:20px 0 14px; display:flex; align-items:center; gap:18px;
}
.ring{flex-shrink:0;}
.progress-text{flex:1;}
.progress-num{font-size:1.9rem; font-weight:900; line-height:1;}
.progress-sub{color:var(--sub); font-size:.82rem; margin-top:4px;}
.bar-track{background:var(--line); height:6px; border-radius:99px; margin-top:10px; overflow:hidden;}
.bar-fill{background:var(--accent); height:100%; border-radius:99px; transition:width .3s ease;}

.milestone{
  border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--card);
  border-radius:10px; padding:14px 16px; margin-bottom:14px; font-size:.86rem; color:var(--sub);
}
.milestone b{color:var(--ink);}
.sync{
  display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--sub);
  margin-bottom:24px; padding:2px 2px;
}
.dot{width:7px; height:7px; border-radius:50%; background:var(--sub); flex-shrink:0;}
.dot.live{background:var(--done);}
.dot.local{background:var(--accent);}

.icon-btn{
  background:none; border:none; color:var(--sub); font-size:.85rem; cursor:pointer;
  padding:2px 5px; border-radius:6px; line-height:1;
}
.icon-btn:hover{color:var(--accent); background:var(--accent-soft);}

.cat{margin-bottom:18px; border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden;}
.cat-head{
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  padding:14px 16px; cursor:pointer; user-select:none;
}
.cat-title{font-weight:700; font-size:.98rem; flex:1;}
.cat-meta{display:flex; align-items:center; gap:2px; color:var(--sub); font-size:.78rem; white-space:nowrap;}
.cat-count{font-variant-numeric:tabular-nums; margin-right:4px;}
.chev{transition:transform .2s ease; color:var(--sub); font-size:.8rem; margin-left:2px;}
.cat.open .chev{transform:rotate(90deg);}
.items{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.cat.open .items{max-height:5000px;}
.item{padding:12px 16px; border-top:1px solid var(--line);}
.item-top{display:flex; align-items:center; gap:6px;}
.item-text{font-size:.9rem; line-height:1.45; flex:1;}
.item.complete .item-text{color:var(--sub); text-decoration:line-through;}

.f-status{
  font-family:inherit; font-size:.76rem; font-weight:500; padding:4px 9px; border-radius:99px;
  border:1px solid var(--line); background:var(--bg); color:var(--sub); cursor:pointer; flex-shrink:0;
}
.f-status.st-ordered{background:var(--warn-bg); color:var(--warn); border-color:var(--warn);}
.f-status.st-done{background:var(--done-bg); color:var(--done); border-color:var(--done);}

.fields{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.field{display:flex; flex-direction:column; gap:2px;}
.field-label{font-size:.66rem; color:var(--sub);}
.fields input, .fields select{
  font-family:inherit; font-size:.78rem; padding:5px 8px; border-radius:7px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink); min-width:0;
}
.f-assignee{width:98px;}
.f-due{width:140px;}
.f-vendor{width:130px;}
.f-approval{width:110px; cursor:pointer; align-self:flex-end;}
.f-approval.ap-pending{background:var(--warn-bg); color:var(--warn); border-color:var(--warn);}
.f-approval.ap-approved{background:var(--done-bg); color:var(--done); border-color:var(--done);}

.add-row{
  padding:12px 16px; border-top:1px solid var(--line); color:var(--accent);
  font-size:.86rem; cursor:pointer; text-align:center;
}
.add-row:hover{background:var(--accent-soft);}
.add-cat{
  border:1px dashed var(--line); border-radius:14px; padding:14px; text-align:center;
  color:var(--accent); font-size:.9rem; cursor:pointer; margin-bottom:18px;
}
.add-cat:hover{background:var(--accent-soft); border-color:var(--accent);}

footer{text-align:center; color:var(--sub); font-size:.76rem; margin-top:30px;}
button.reset{
  background:none; border:1px solid var(--line); color:var(--sub); border-radius:8px;
  padding:6px 12px; font-size:.76rem; cursor:pointer; font-family:inherit;
}
button.reset:hover{border-color:var(--accent); color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>新規開業準備 進捗管理</h1>
    <p class="lead">カテゴリ・タスクの追加/編集/削除ができます。変更はスプレッドシートと共有されます。</p>
  </header>

  <div class="progress-card">
    <svg class="ring" width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="30" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle id="ringFill" cx="36" cy="36" r="30" fill="none" stroke="var(--accent)" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"
        transform="rotate(-90 36 36)"/>
    </svg>
    <div class="progress-text">
      <div class="progress-num" id="pctNum">0%</div>
      <div class="progress-sub" id="pctSub">完了 0 / 0</div>
      <div class="progress-sub" id="apprSub">承認済み 0 / 0</div>
      <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="milestone">
    内装工事は<b>着工済み</b>。完了・引き渡し予定日は<b>11月16日</b>。
  </div>
  <div class="sync" id="syncStatus"><span class="dot"></span><span>接続を確認中…</span></div>

  <div id="categories"></div>
  <div class="add-cat" id="addCatBtn">＋ カテゴリを追加</div>

  <footer>
    <button class="reset" id="resetBtn">ステータスをすべて「未対応」に戻す</button>
  </footer>
</div>

<script>
// 初期データ（初回のみ、シートが空のときに自動投入されます）
const SEED = [
  { title: "総務的備品", tasks: [
      "通信設備系（PBX関連・複合機）","職員用冷蔵庫","掃除機","什器類（キャビネット・スチールラック）",
      "シュレッダー","駐車場の確保","車両の手配","ウォーターサーバー","アルコールチェッカー","各種アカウントの設定"
  ]},
  { title: "事務的備品", tasks: ["事務的備品一式の手配"] },
  { title: "医療機器等の購入", tasks: [
      "電子カルテ","ポータブルエコー（V-SCAN候補）","ポータブル心電図","医療用冷蔵庫","滅菌機","麻薬金庫","医療用廃棄物の処理手配"
  ]},
  { title: "医療材料等", tasks: ["卸への発注手配"] },
  { title: "診療バッグ等", tasks: ["診療バッグ等の準備"] },
  { title: "外注契約", tasks: ["検体検査の外注契約","医療ごみ処理の外注契約","産業ごみ（一般ごみ）処理の外注契約"] },
];

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx-jPnyjqfcHuIPj8u-LsMG1urnmQmbN4WpPjtuny61--EpIgHJv_4BPKYrwsYEOWUUjw/exec";
const POLL_MS = 6000;
const STATUS_OPTIONS = ["未対応", "発注済", "完了"];
const STORAGE_KEY = "clinic-prep-progress-v4";

let categories = [];
let tasks = [];
let mode = "local";
let pending = false;
const openState = {};

function genId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) { const d = JSON.parse(raw); categories = d.categories || []; tasks = d.tasks || []; }
} catch(e) {}

function setSyncBanner(kind, text) {
  document.getElementById("syncStatus").innerHTML =
    `<span class="dot ${kind === "shared" ? "live" : "local"}"></span><span>${text}</span>`;
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({categories, tasks})); } catch(e) {}
}

async function callApi(params) {
  const qs = Object.entries(params).map(([k,v]) => k + "=" + encodeURIComponent(v)).join("&");
  const res = await fetch(WEBAPP_URL + "?" + qs);
  if (!res.ok) throw new Error("api failed");
  return res.json();
}

async function seedIfEmpty() {
  if (categories.length > 0) return;
  for (const cat of SEED) {
    const catId = genId("c");
    await doAction("addCategory", { id: catId, title: cat.title }, () => {
      categories.push({ id: catId, title: cat.title });
    });
    for (const text of cat.tasks) {
      const taskId = genId("t");
      await doAction("addTask", { id: taskId, catId, text }, () => {
        tasks.push({ id: taskId, catId, text, status:"未対応", assignee:"", due:"", vendor:"", approval:"" });
      });
    }
  }
}

async function doAction(action, params, localMutate) {
  if (mode === "shared") {
    try {
      const data = await callApi({ action, ...params });
      categories = data.categories || categories;
      tasks = data.tasks || tasks;
      return;
    } catch (e) {
      setSyncBanner("local", "更新の送信に失敗しました。接続を確認してください");
    }
  }
  localMutate();
  saveLocal();
}

async function poll() {
  if (pending) return;
  try {
    const data = await callApi({ action: "get" });
    categories = data.categories || [];
    tasks = data.tasks || [];
    setSyncBanner("shared", "スプレッドシートと共有中（数秒ごとに自動更新）");
    render();
  } catch (e) {
    setSyncBanner("local", "共有先に接続できません（この端末にのみ保存されます）");
  }
}

async function initSync() {
  if (!WEBAPP_URL || WEBAPP_URL.indexOf("PASTE_YOUR") === 0) {
    setSyncBanner("local", "この端末にのみ保存されます（WEBAPP_URL未設定）");
    if (categories.length === 0) { SEED.forEach(cat => {
      const catId = genId("c");
      categories.push({ id: catId, title: cat.title });
      cat.tasks.forEach(text => tasks.push({ id: genId("t"), catId, text, status:"未対応", assignee:"", due:"", vendor:"", approval:"" }));
    }); saveLocal(); }
    render();
    return;
  }
  try {
    const data = await callApi({ action: "get" });
    categories = data.categories || [];
    tasks = data.tasks || [];
    mode = "shared";
    await seedIfEmpty();
    setSyncBanner("shared", "スプレッドシートと共有中（数秒ごとに自動更新）");
    render();
    setInterval(poll, POLL_MS);
  } catch (e) {
    setSyncBanner("local", "共有先に接続できません（この端末にのみ保存されます）");
    render();
  }
}

function statusClass(s) {
  if (s === "発注済") return "st-ordered";
  if (s === "完了") return "st-done";
  return "";
}

// ---- カテゴリ/タスク操作 ----
function addCategory() {
  const title = prompt("新しいカテゴリ名を入力してください");
  if (!title || !title.trim()) return;
  const id = genId("c");
  doAction("addCategory", { id, title: title.trim() }, () => categories.push({ id, title: title.trim() }))
    .then(render);
}
function renameCategory(cat) {
  const title = prompt("カテゴリ名を編集", cat.title);
  if (!title || !title.trim() || title.trim() === cat.title) return;
  doAction("renameCategory", { id: cat.id, title: title.trim() }, () => { cat.title = title.trim(); }).then(render);
}
function deleteCategory(cat) {
  if (!confirm(`「${cat.title}」と中のタスクをすべて削除しますか？`)) return;
  doAction("deleteCategory", { id: cat.id }, () => {
    categories = categories.filter(c => c.id !== cat.id);
    tasks = tasks.filter(t => t.catId !== cat.id);
  }).then(render);
}
function addTask(catId) {
  const text = prompt("新しいタスク名を入力してください");
  if (!text || !text.trim()) return;
  const id = genId("t");
  doAction("addTask", { id, catId, text: text.trim() }, () =>
    tasks.push({ id, catId, text: text.trim(), status:"未対応", assignee:"", due:"", vendor:"", approval:"" })
  ).then(render);
}
function renameTask(task) {
  const text = prompt("タスク名を編集", task.text);
  if (!text || !text.trim() || text.trim() === task.text) return;
  doAction("renameTask", { id: task.id, text: text.trim() }, () => { task.text = text.trim(); }).then(render);
}
function deleteTask(task) {
  if (!confirm(`「${task.text}」を削除しますか？`)) return;
  doAction("deleteTask", { id: task.id }, () => { tasks = tasks.filter(t => t.id !== task.id); }).then(render);
}
function updateTaskField(task, field, value) {
  doAction("updateTask", { id: task.id, field, value }, () => { task[field] = value; }).then(render);
}

function render() {
  const root = document.getElementById("categories");
  root.innerHTML = "";
  let total = 0, doneCount = 0, apprTotal = 0, apprDone = 0;

  categories.forEach(cat => {
    const catTasks = tasks.filter(t => t.catId === cat.id);
    const catDone = catTasks.filter(t => t.status === "完了").length;
    total += catTasks.length; doneCount += catDone;

    const el = document.createElement("div");
    el.className = "cat" + (openState[cat.id] ? " open" : "");

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `
      <span class="cat-title"></span>
      <span class="cat-meta">
        <span class="cat-count">${catDone}/${catTasks.length}</span>
        <button class="icon-btn" data-act="edit">✎</button>
        <button class="icon-btn" data-act="del">×</button>
        <span class="chev">›</span>
      </span>
    `;
    head.querySelector(".cat-title").textContent = cat.title;
    head.addEventListener("click", () => { openState[cat.id] = !openState[cat.id]; render(); });
    head.querySelector('[data-act="edit"]').addEventListener("click", (e) => { e.stopPropagation(); renameCategory(cat); });
    head.querySelector('[data-act="del"]').addEventListener("click", (e) => { e.stopPropagation(); deleteCategory(cat); });
    el.appendChild(head);

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "items";
    catTasks.forEach(task => {
      apprTotal++;
      if (task.approval === "承認済み") apprDone++;

      const row = document.createElement("div");
      row.className = "item" + (task.status === "完了" ? " complete" : "");

      const top = document.createElement("div");
      top.className = "item-top";
      top.innerHTML = `
        <span class="item-text"></span>
        <button class="icon-btn" data-act="edit">✎</button>
        <button class="icon-btn" data-act="del">×</button>
        <select class="f-status ${statusClass(task.status)}">
          ${STATUS_OPTIONS.map(s => `<option value="${s}" ${task.status === s ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      `;
      top.querySelector(".item-text").textContent = task.text;
      top.querySelector('[data-act="edit"]').addEventListener("click", () => renameTask(task));
      top.querySelector('[data-act="del"]').addEventListener("click", () => deleteTask(task));
      top.querySelector(".f-status").addEventListener("change", (e) => updateTaskField(task, "status", e.target.value));
      row.appendChild(top);

      const fields = document.createElement("div");
      fields.className = "fields";
      fields.innerHTML = `
        <div class="field"><span class="field-label">担当者</span><input class="f-assignee" placeholder="氏名"></div>
        <div class="field"><span class="field-label">納期</span><input class="f-due" type="date"></div>
        <div class="field"><span class="field-label">発注先</span><input class="f-vendor" placeholder="会社名"></div>
        <select class="f-approval ${task.approval === "申請中" ? "ap-pending" : task.approval === "承認済み" ? "ap-approved" : ""}">
          <option value="">承認: 未定</option>
          <option value="申請中">承認: 申請中</option>
          <option value="承認済み">承認: 承認済み</option>
        </select>
      `;
      fields.querySelector(".f-assignee").value = task.assignee || "";
      fields.querySelector(".f-due").value = task.due || "";
      fields.querySelector(".f-vendor").value = task.vendor || "";
      fields.querySelector(".f-approval").value = task.approval || "";
      fields.querySelector(".f-assignee").addEventListener("change", (e) => updateTaskField(task, "assignee", e.target.value));
      fields.querySelector(".f-due").addEventListener("change", (e) => updateTaskField(task, "due", e.target.value));
      fields.querySelector(".f-vendor").addEventListener("change", (e) => updateTaskField(task, "vendor", e.target.value));
      fields.querySelector(".f-approval").addEventListener("change", (e) => updateTaskField(task, "approval", e.target.value));
      row.appendChild(fields);

      itemsWrap.appendChild(row);
    });

    const addTaskRow = document.createElement("div");
    addTaskRow.className = "add-row";
    addTaskRow.textContent = "＋ タスクを追加";
    addTaskRow.addEventListener("click", () => addTask(cat.id));
    itemsWrap.appendChild(addTaskRow);

    el.appendChild(itemsWrap);
    root.appendChild(el);
  });

  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  document.getElementById("pctNum").textContent = pct + "%";
  document.getElementById("pctSub").textContent = `完了 ${doneCount} / ${total}`;
  document.getElementById("apprSub").textContent = `承認済み ${apprDone} / ${apprTotal}`;
  document.getElementById("barFill").style.width = pct + "%";
  const circumference = 188.5;
  document.getElementById("ringFill").style.strokeDashoffset = circumference - (circumference * pct / 100);
}

document.getElementById("addCatBtn").addEventListener("click", addCategory);
document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("すべてのステータスを「未対応」に戻しますか？（担当者・納期・発注先・承認状況は残ります）")) return;
  for (const t of tasks) {
    await doAction("updateTask", { id: t.id, field: "status", value: "未対応" }, () => { t.status = "未対応"; });
  }
  render();
});

render();
initSync();
</script>
</body>
</html>
