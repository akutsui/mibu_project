<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開業準備 進捗管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --ink:#20302c; --sub:#5b6b66; --line:#dcd6c8;
  --accent:#a8672f; --accent-soft:#f1e2ce; --card:#ffffff; --done:#5c7a63; --done-bg:#e7efe6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161c1a; --ink:#eee9df; --sub:#a3ab a4; --sub:#9aa39c; --line:#33403a;
    --accent:#e0a367; --accent-soft:#2c2419; --card:#1f2723; --done:#8fb59a; --done-bg:#1d2b21;
  }
}
:root[data-theme="dark"]{
  --bg:#161c1a; --ink:#eee9df; --sub:#9aa39c; --line:#33403a;
  --accent:#e0a367; --accent-soft:#2c2419; --card:#1f2723; --done:#8fb59a; --done-bg:#1d2b21;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:760px; margin:0 auto; padding:32px 20px 80px;}
header{margin-bottom:28px;}
h1{font-size:1.5rem; font-weight:900; margin:0 0 4px; letter-spacing:.02em;}
.lead{color:var(--sub); font-size:.88rem; margin:0;}

.progress-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:20px; margin:20px 0 26px; display:flex; align-items:center; gap:18px;
}
.ring{flex-shrink:0;}
.progress-text{flex:1;}
.progress-num{font-size:1.9rem; font-weight:900; line-height:1;}
.progress-sub{color:var(--sub); font-size:.82rem; margin-top:4px;}
.bar-track{background:var(--line); height:6px; border-radius:99px; margin-top:10px; overflow:hidden;}
.bar-fill{background:var(--accent); height:100%; border-radius:99px; transition:width .3s ease;}

.milestone{
  border:1px solid var(--line); border-left:4px solid var(--accent); background:var(--card);
  border-radius:10px; padding:14px 16px; margin-bottom:14px; font-size:.86rem; color:var(--sub);
}
.milestone b{color:var(--ink);}
.sync{
  display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--sub);
  margin-bottom:24px; padding:2px 2px;
}
.dot{width:7px; height:7px; border-radius:50%; background:var(--sub); flex-shrink:0;}
.dot.live{background:var(--done);}
.dot.local{background:var(--accent);}

.cat{margin-bottom:18px; border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden;}
.cat-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 16px; cursor:pointer; user-select:none;
}
.cat-title{font-weight:700; font-size:.98rem;}
.cat-meta{display:flex; align-items:center; gap:10px; color:var(--sub); font-size:.78rem; white-space:nowrap;}
.cat-count{font-variant-numeric:tabular-nums;}
.chev{transition:transform .2s ease; color:var(--sub); font-size:.8rem;}
.cat.open .chev{transform:rotate(90deg);}
.cat-note{padding:0 16px 12px; margin-top:-6px; color:var(--sub); font-size:.78rem;}
.items{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.cat.open .items{max-height:1200px;}
.item{
  display:flex; align-items:flex-start; gap:10px; padding:10px 16px;
  border-top:1px solid var(--line);
}
.item label{display:flex; align-items:flex-start; gap:10px; cursor:pointer; width:100%;}
.item input{margin-top:3px; width:17px; height:17px; accent-color:var(--accent); flex-shrink:0;}
.item-text{font-size:.9rem; line-height:1.45;}
.item.done .item-text{color:var(--sub); text-decoration:line-through;}
.badge{
  display:inline-block; font-size:.7rem; padding:1px 7px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent); margin-left:6px; white-space:nowrap;
}
.item.done .badge{background:var(--done-bg); color:var(--done);}

footer{text-align:center; color:var(--sub); font-size:.76rem; margin-top:30px;}
button.reset{
  background:none; border:1px solid var(--line); color:var(--sub); border-radius:8px;
  padding:6px 12px; font-size:.76rem; cursor:pointer; font-family:inherit;
}
button.reset:hover{border-color:var(--accent); color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>新規開業準備 進捗管理</h1>
    <p class="lead">項目をタップしてチェック。進捗はこの端末に自動保存されます。</p>
  </header>

  <div class="progress-card">
    <svg class="ring" width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="30" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle id="ringFill" cx="36" cy="36" r="30" fill="none" stroke="var(--accent)" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"
        transform="rotate(-90 36 36)"/>
    </svg>
    <div class="progress-text">
      <div class="progress-num" id="pctNum">0%</div>
      <div class="progress-sub" id="pctSub">0 / 0 完了</div>
      <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="milestone">
    内装工事は<b>着工済み</b>。完了・引き渡し予定日は<b>11月16日</b>。総務的備品は11〜12月に準備予定。
  </div>
  <div class="sync" id="syncStatus"><span class="dot"></span><span>接続を確認中…</span></div>

  <div id="categories"></div>

  <footer>
    <button class="reset" id="resetBtn">チェックをすべてリセット</button>
  </footer>
</div>

<script>
const DATA = [
  {
    id: "somu", title: "総務的備品", note: "11〜12月に準備",
    items: [
      { t: "通信設備系（PBX関連・複合機）" },
      { t: "職員用冷蔵庫" },
      { t: "掃除機" },
      { t: "什器類（キャビネット・スチールラック）" },
      { t: "シュレッダー" },
      { t: "駐車場の確保", d: "近隣に空きなし。徒歩10分圏内なら可。必要20台／施設前4台のみ" },
      { t: "車両の手配", d: "開業1か月前まで" },
      { t: "ウォーターサーバー" },
      { t: "アルコールチェッカー", d: "1か月前" },
      { t: "各種アカウントの設定", d: "1か月前" },
    ]
  },
  {
    id: "jimu", title: "事務的備品", note: "サポートチームに依頼",
    items: [ { t: "事務的備品一式の手配依頼" } ]
  },
  {
    id: "keiri", title: "経理対応", note: "",
    items: [
      { t: "入出金管理の体制構築" },
      { t: "手持ち現金の管理体制構築" },
    ]
  },
  {
    id: "iryoki", title: "医療機器等の購入", note: "保健所の検査に間に合うように",
    items: [
      { t: "電子カルテ", d: "1か月前" },
      { t: "ポータブルエコー（V-SCAN候補）", d: "1台" },
      { t: "ポータブル心電図", d: "1台" },
      { t: "医療用冷蔵庫", d: "1台" },
      { t: "滅菌機", d: "1台" },
      { t: "麻薬金庫", d: "1台" },
      { t: "医療用廃棄物の処理手配" },
    ]
  },
  {
    id: "zairyo", title: "医療材料等", note: "卸から購入するには届出の控えが必要",
    items: [ { t: "卸への発注手配", d: "直前に対応" } ]
  },
  {
    id: "bag", title: "診療バッグ等", note: "サポートチームと連携対応",
    items: [ { t: "診療バッグ等の準備" } ]
  },
  {
    id: "gaichu", title: "外注契約", note: "",
    items: [
      { t: "検体検査の外注契約" },
      { t: "医療ごみ処理の外注契約" },
      { t: "産業ごみ（一般ごみ）処理の外注契約" },
    ]
  },
];

// ここにGoogle Apps ScriptのウェブアプリURLを貼り付けてください
// 例: https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXX/exec
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx-jPnyjqfcHuIPj8u-LsMG1urnmQmbN4WpPjtuny61--EpIgHJv_4BPKYrwsYEOWUUjw/exec";
const POLL_MS = 6000;

const STORAGE_KEY = "clinic-prep-progress-v1";
let state = {};
let mode = "local"; // "local" | "shared"
let pollTimer = null;
let pending = false;

try {
  const raw = localStorage.getItem(STORAGE_KEY);
  state = raw ? JSON.parse(raw) : {};
} catch(e) { state = {}; }

function setSyncBanner(kind, text) {
  const el = document.getElementById("syncStatus");
  el.innerHTML = `<span class="dot ${kind === "shared" ? "live" : "local"}"></span><span>${text}</span>`;
}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

async function fetchState() {
  const res = await fetch(WEBAPP_URL + "?action=get");
  if (!res.ok) throw new Error("fetch failed");
  const data = await res.json();
  return data.checks || {};
}

async function pushCheck(key, value) {
  const url = WEBAPP_URL + "?action=set&key=" + encodeURIComponent(key) + "&value=" + value;
  const res = await fetch(url);
  if (!res.ok) throw new Error("update failed");
  const data = await res.json();
  return data.checks || {};
}

async function poll() {
  if (pending) return;
  try {
    const checks = await fetchState();
    state = checks;
    setSyncBanner("shared", "スプレッドシートと共有中（数秒ごとに自動更新）");
    render();
  } catch (e) {
    setSyncBanner("local", "共有先に接続できません（この端末にのみ保存されます）");
  }
}

function save(key, value) {
  if (mode === "shared") {
    pending = true;
    pushCheck(key, value)
      .then(checks => { state = checks; })
      .catch(() => { setSyncBanner("local", "更新の送信に失敗しました。接続を確認してください"); })
      .finally(() => { pending = false; render(); });
  } else {
    saveLocal();
  }
}

async function initSync() {
  if (!WEBAPP_URL || WEBAPP_URL.indexOf("PASTE_YOUR") === 0) {
    setSyncBanner("local", "この端末にのみ保存されます（WEBAPP_URL未設定）");
    return;
  }
  try {
    state = await fetchState();
    mode = "shared";
    setSyncBanner("shared", "スプレッドシートと共有中（数秒ごとに自動更新）");
    render();
    pollTimer = setInterval(poll, POLL_MS);
  } catch (e) {
    setSyncBanner("local", "共有先に接続できません（この端末にのみ保存されます）");
  }
}

const openState = {};

function render() {
  const root = document.getElementById("categories");
  root.innerHTML = "";
  let total = 0, doneCount = 0;

  DATA.forEach(cat => {
    const catDone = cat.items.filter(it => state[cat.id + ":" + it.t]).length;
    total += cat.items.length; doneCount += catDone;

    const el = document.createElement("div");
    el.className = "cat" + (openState[cat.id] ? " open" : "");

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `
      <span class="cat-title">${cat.title}</span>
      <span class="cat-meta"><span class="cat-count">${catDone}/${cat.items.length}</span><span class="chev">›</span></span>
    `;
    head.addEventListener("click", () => {
      openState[cat.id] = !openState[cat.id];
      render();
    });
    el.appendChild(head);

    if (cat.note) {
      const note = document.createElement("div");
      note.className = "cat-note";
      note.textContent = cat.note;
      el.appendChild(note);
    }

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "items";
    cat.items.forEach(it => {
      const key = cat.id + ":" + it.t;
      const checked = !!state[key];
      const row = document.createElement("div");
      row.className = "item" + (checked ? " done" : "");
      row.innerHTML = `
        <label>
          <input type="checkbox" ${checked ? "checked" : ""}>
          <span class="item-text">${it.t}${it.d ? `<span class="badge">${it.d}</span>` : ""}</span>
        </label>
      `;
      row.querySelector("input").addEventListener("change", (e) => {
        state[key] = e.target.checked;
        save(key, e.target.checked);
        render();
      });
      itemsWrap.appendChild(row);
    });
    el.appendChild(itemsWrap);
    root.appendChild(el);
  });

  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  document.getElementById("pctNum").textContent = pct + "%";
  document.getElementById("pctSub").textContent = `${doneCount} / ${total} 完了`;
  document.getElementById("barFill").style.width = pct + "%";
  const circumference = 188.5;
  document.getElementById("ringFill").style.strokeDashoffset = circumference - (circumference * pct / 100);
}

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("すべてのチェックをリセットしますか？")) return;
  const keys = Object.keys(state);
  state = {};
  if (mode === "shared") {
    for (const k of keys) { try { await pushCheck(k, false); } catch(e) {} }
  } else {
    saveLocal();
  }
  render();
});

render();
initSync();
</script>
</body>
</html>
